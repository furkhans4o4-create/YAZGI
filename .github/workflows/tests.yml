name: YAZGI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: yazgi-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v94 regression gate
        run: node --test --test-name-pattern='v94 ' tests/systems.test.cjs
      - name: Validate 1,000 early-life cards and lifetime deduplication (v95-v96)
        run: node --test --test-name-pattern='v95 |v96 ' tests/systems.test.cjs
      - name: Validate all 500 youth cards and unlock rules (v97)
        run: node --test --test-name-pattern='v97 ' tests/systems.test.cjs
      - name: Validate 500 age 16-17 events and narrative continuity (v98)
        run: node --test --test-name-pattern='v98 ' tests/systems.test.cjs
      - name: Validate 500 adulthood event cards and condition rules (v99)
        run: node --test --test-name-pattern='v99 ' tests/systems.test.cjs
      - name: Validate 500 age 50-64 life events and continuity (v100)
        run: node --test --test-name-pattern='v100 ' tests/systems.test.cjs
      - name: Validate elder 65+ event pack and succession (v101)
        run: node --test --test-name-pattern='v101 ' tests/systems.test.cjs
      - name: Run complete regression suite (all versions)
        run: node --test tests/systems.test.cjs
