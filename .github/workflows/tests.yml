name: YAZGI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: yazgi-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v80 regression gate
        run: node --test --test-name-pattern='v80 ' tests/systems.test.cjs
      - name: Run v79 regression gate
        run: node --test --test-name-pattern='v79 ' tests/systems.test.cjs
      - name: Run v78 regression gate
        run: node --test --test-name-pattern='v78 ' tests/systems.test.cjs
      - name: Run v77 regression gate
        run: node --test --test-name-pattern='v77 ' tests/systems.test.cjs
      - name: Run v76 regression gate
        run: node --test --test-name-pattern='v76 ' tests/systems.test.cjs
      - name: Run v75 regression gate
        run: node --test --test-name-pattern='v75 ' tests/systems.test.cjs
      - name: Run v74 regression gate
        run: node --test --test-name-pattern='v74 ' tests/systems.test.cjs
      - name: Run v73 regression gate
        run: node --test --test-name-pattern='v73 ' tests/systems.test.cjs
      - name: Run v72 regression gate
        run: node --test --test-name-pattern='v72 ' tests/systems.test.cjs
      - name: Run v71 regression gate
        run: node --test --test-name-pattern='v71 ' tests/systems.test.cjs
      - name: Run v70 regression gate
        run: node --test --test-name-pattern='v70 ' tests/systems.test.cjs
      - name: Run v69 regression gate
        run: node --test --test-name-pattern='v69 ' tests/systems.test.cjs
      - name: Run v68 regression gate
        run: node --test --test-name-pattern='v68 ' tests/systems.test.cjs
      - name: Run v67 regression gate
        run: node --test --test-name-pattern='v67 ' tests/systems.test.cjs
      - name: Run v66 regression gate
        run: node --test --test-name-pattern='v66 ' tests/systems.test.cjs
      - name: Run v65 regression gate
        run: node --test --test-name-pattern='v65 ' tests/systems.test.cjs
      - name: Run complete regression suite
        run: node --test tests/systems.test.cjs
