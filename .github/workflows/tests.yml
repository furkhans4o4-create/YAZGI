name: YAZGI v30 Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v30:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v30 regression gate
        run: node --test --test-name-pattern='v30 ' tests/systems.test.cjs
      - name: Audit complete historical suite
        continue-on-error: true
        run: node --test tests/systems.test.cjs
