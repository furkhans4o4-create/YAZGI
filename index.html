<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAZGI</title><style>

:root{
 --bg:#14160f;--panel:#eee2bd;--panel2:#f8efcf;--ink:#201d15;--muted:#776b52;
 --line:#cbb98a;--green:#5d7652;--red:#a44a3a;--gold:#b58a38;--shadow:0 20px 55px #0006;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:
radial-gradient(circle at 50% 0,#3e3a2a 0,#202217 32%,#11120d 100%);color:#efe6cf}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background:
repeating-linear-gradient(45deg,transparent 0 34px,#fff 35px 36px,transparent 37px 70px)}
button,input,select{font:inherit}
.app{max-width:1280px;margin:auto;padding:16px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:32px;font-weight:900;letter-spacing:.2em}.tag{font-size:12px;opacity:.7}
.top button{background:#ffffff0d;border:1px solid #ffffff2b;color:#f5ecd2;padding:9px 13px;border-radius:11px;cursor:pointer;font-weight:800}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px}
.panel{background:linear-gradient(#f3e8c7,#e7d6ab);color:var(--ink);border:1px solid #fff5;border-radius:18px;box-shadow:var(--shadow)}
.profile,.side{padding:15px;height:max-content;position:sticky;top:16px}
.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:42px;background:radial-gradient(circle,#dac28a,#a88145);border:5px solid #f8edd0}
.name{text-align:center;font-size:22px;font-weight:900;margin-top:8px}.meta{text-align:center;color:var(--muted);font-size:12px;line-height:1.45}
.wealth{text-align:center;font-size:19px;font-weight:900;color:#6d4b1f;margin:10px 0}
.stats{display:grid;gap:8px}.stat{display:grid;grid-template-columns:76px 1fr 29px;gap:6px;align-items:center;font-size:11px}
.bar{height:7px;background:#d3c6a5;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}

.qbtn:hover,.sidebtn:hover{background:#fff5db}
.qbtn:disabled,.card.locked{opacity:.48;cursor:not-allowed;filter:grayscale(.25)}
.lockline{font-size:10px;color:#8b6745;font-weight:800;margin-top:5px}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.skillpill{background:#e2d2a9;border:1px solid #c6b480;border-radius:8px;padding:6px 7px;font-size:10px;display:flex;justify-content:space-between}
.sectionTitle{margin:14px 0 7px;font-size:13px;border-bottom:1px solid #cbb98a;padding-bottom:5px}
.req{font-size:10px;color:#8a6d48;font-weight:700}
.comrade{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dangerBtn{border:1px solid #a85b4d;background:#edd0bd;color:#74372d;border-radius:9px;padding:9px;font-weight:900;cursor:pointer}
.main{display:flex;flex-direction:column;gap:12px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
.age{font-size:36px;font-weight:900;line-height:1}.age small{font-size:13px;color:var(--muted)}
.agebtn{border:0;border-radius:12px;padding:13px 22px;background:var(--green);color:white;font-weight:900;cursor:pointer}
.tabs{display:flex;gap:5px;flex-wrap:wrap;padding:9px}.tab{border:0;background:transparent;color:#6e624c;padding:9px 11px;border-radius:9px;cursor:pointer;font-weight:900;font-size:12px}
.tab.active{background:#d8c79d;color:#2e281c}.tab:disabled{opacity:.38;cursor:not-allowed}.content{padding:12px}
.timeline{display:flex;flex-direction:column;gap:8px;max-height:610px;overflow:auto;padding-right:4px}
.log{background:#faf0d3;border-left:3px solid #a59060;border-radius:0 12px 12px 0;padding:10px 11px;font-size:13px;line-height:1.45}
.log.good{border-color:#66865c}.log.bad{border-color:#a54b3c}.log.major{border-color:#b78a38;background:#fff3c9}
.eventBoard{display:grid;gap:10px;margin-bottom:12px}
.storyArcWrap{display:grid;gap:7px;margin:0 0 12px}
.storyArcTitle{font-size:11px;font-weight:1000;color:#715e3d;margin:2px 0}
.storyArc{border:1px solid #d2c092;border-radius:12px;background:#f8edcf;padding:8px 10px}
.storyArc.active{border-color:#a99155;background:#fbf0cd}.storyArc.done{opacity:.78}.storyArc.closed{opacity:.6;filter:grayscale(.25)}
.storyArcHead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:10px}.storyArcHead strong{font-size:11px}.storyArcHead span{font-size:9px;font-weight:900;color:#776648}
.storyArcBar{height:5px;border-radius:999px;background:#dfd2ad;overflow:hidden;margin-top:6px}.storyArcBar i{display:block;height:100%;background:#6e8a58;border-radius:999px}
.storyArcMeta{font-size:9px;color:#74664d;margin-top:5px;line-height:1.35}

.decisionOverlay{position:fixed;inset:0;z-index:140;background:rgba(7,9,6,.82);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px;overflow:hidden}
.decisionOverlay:before,.decisionOverlay:after{content:"";position:absolute;top:0;bottom:0;width:46%;opacity:0;pointer-events:none;transition:opacity .12s ease}
.decisionOverlay:before{left:0;background:radial-gradient(circle at 0 50%,rgba(177,68,54,.35),transparent 68%)}
.decisionOverlay:after{right:0;background:radial-gradient(circle at 100% 50%,rgba(47,132,105,.38),transparent 68%)}
.decisionOverlay.lean-left:before{opacity:var(--swipe-strength,.7)}
.decisionOverlay.lean-right:after{opacity:var(--swipe-strength,.7)}
.decisionStage{position:relative;width:min(1120px,96vw);min-height:min(620px,88vh);display:grid;grid-template-columns:minmax(190px,1fr) minmax(310px,440px) minmax(190px,1fr);gap:28px;align-items:center}
.decisionSide{position:relative;z-index:2;min-height:250px;border:1px solid transparent;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px;opacity:.18;transform:scale(.94);transition:opacity .12s ease,transform .12s ease,box-shadow .12s ease;background:rgba(20,20,16,.46);color:#f8efd9;cursor:pointer}
.decisionSide.left{border-color:rgba(207,103,83,.7);background:linear-gradient(135deg,rgba(122,43,35,.86),rgba(75,31,28,.58))}
.decisionSide.right{border-color:rgba(92,174,143,.72);background:linear-gradient(225deg,rgba(31,104,83,.88),rgba(26,67,58,.58))}
.decisionSide.active{opacity:1;transform:scale(1.02)}
.decisionSide.left.active{box-shadow:0 0 55px rgba(190,74,56,.33)}
.decisionSide.right.active{box-shadow:0 0 55px rgba(53,151,117,.34)}
.decisionSide:disabled{cursor:not-allowed;filter:grayscale(.8);opacity:.16}
.decisionDirection{font-size:30px;line-height:1;font-weight:900}
.decisionChoice{font-size:17px;font-weight:900;line-height:1.25}
.decisionIssue{font-size:11px;font-weight:800;color:#ffd8cb}
.impactList{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.impact{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:900}
.impact.pos{background:rgba(93,181,126,.18);border-color:rgba(133,224,164,.27)}
.impact.neg{background:rgba(221,91,74,.18);border-color:rgba(255,136,119,.27)}
.impact.neutral{background:rgba(255,224,159,.12);border-color:rgba(255,224,159,.2)}
.swipeCard{position:relative;z-index:4;width:100%;min-height:330px;border:1px solid #b79c61;background:linear-gradient(145deg,#fff2c8,#e5cf96);color:#211d15;border-radius:22px;padding:24px;box-shadow:0 30px 90px #0009;cursor:grab;user-select:none;touch-action:none;transition:transform .2s ease,opacity .2s ease,box-shadow .12s ease;display:flex;flex-direction:column}
.swipeCard.dragging{transition:none;cursor:grabbing}
.swipeCard:before{content:"";position:absolute;inset:9px;border:1px solid #9f834955;border-radius:15px;pointer-events:none}
.swipeTop{display:flex;justify-content:space-between;gap:10px;align-items:center;position:relative;z-index:1}
.swipeTitle{font-size:21px;font-weight:900}
.swipeMeta{font-size:11px;color:#786443;margin-top:7px;position:relative;z-index:1}
.swipeText{font-size:17px;line-height:1.55;margin:auto 2px;position:relative;z-index:1;padding:26px 0}
.swipeInstruction{text-align:center;font-size:11px;color:#7d6b4d;margin-top:8px;position:relative;z-index:1}
.swipeBadge{display:inline-block;padding:5px 8px;border-radius:999px;background:#d7c69a;color:#5e5037;font-size:10px;font-weight:900}
.swipeLeftStamp,.swipeRightStamp{position:absolute;top:52px;font-size:17px;font-weight:900;padding:5px 9px;border:3px solid;border-radius:9px;opacity:0;z-index:5;pointer-events:none;max-width:70%}
.swipeLeftStamp{left:18px;color:#a44234;border-color:#a44234;transform:rotate(-8deg)}
.swipeRightStamp{right:18px;color:#39765f;border-color:#39765f;transform:rotate(8deg)}
.decisionHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;color:#dfd3b8;font-size:11px;text-align:center;opacity:.8;white-space:nowrap}
.decisionPager{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;border:1px solid #ffffff26;background:#14160fd9;color:#eee2bd;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;cursor:pointer}
@media(max-width:820px){.decisionOverlay{padding:10px}.decisionStage{width:100%;min-height:94vh;grid-template-columns:88px minmax(0,1fr) 88px;gap:8px}.decisionSide{min-height:200px;padding:8px;border-radius:14px}.decisionDirection{font-size:23px}.decisionChoice{font-size:11px}.impactList{gap:4px}.impact{font-size:9px;padding:5px 6px}.swipeCard{min-height:300px;padding:18px}.swipeTitle{font-size:18px}.swipeText{font-size:15px}.decisionHint{white-space:normal;width:70%}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);background:#f9efd0;border-radius:12px;padding:11px;text-align:left;color:#282319}
button.card{cursor:pointer}.card:hover{background:#fff5dc}.card h3{margin:0 0 4px;font-size:14px}.card p{margin:0;color:#74684f;font-size:11px;line-height:1.4}
.side h3{font-size:13px;margin:3px 0 8px}.sidegroup{display:grid;gap:6px;margin-bottom:12px}.sidebtn{text-align:left}
.badge{display:inline-block;padding:3px 6px;border-radius:999px;background:#ded0aa;font-size:10px;color:#5a503d}

.modalwrap{position:fixed;inset:0;background:#0c0e0adf;display:none;place-items:center;padding:14px;z-index:30}.modalwrap.show{display:grid}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#efe2bd;color:#201c13;border-radius:18px;padding:20px;box-shadow:0 30px 90px #000b}
.modal h2{margin-top:0}.row{display:grid;gap:5px;margin:10px 0}label{font-size:11px;color:#6f634c;font-weight:800}
select,input{padding:10px;border:1px solid #c8b68a;border-radius:9px;background:#fff7df;color:#251f16}
.mbuttons{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.mbtn{border:0;padding:10px 13px;border-radius:9px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:white}.ghost{background:#d9c79d}
.note{color:#756a52;font-size:11px;line-height:1.45}.relation{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rbar{height:5px;width:70px;background:#d5c8a8;border-radius:99px;overflow:hidden}.rbar i{display:block;height:100%;background:#66865c}
@media(max-width:980px){.layout{grid-template-columns:240px 1fr}.side{position:static;grid-column:1/-1}.side .sidegroup{grid-template-columns:repeat(3,1fr)}}

.calendarline{margin-top:7px;font-size:13px;color:#6e5126;font-weight:800}
.timebox{display:flex;align-items:flex-end;gap:10px;flex-direction:column}
.monthrights{font-size:12px;font-weight:900;color:#6a604c;background:#dfd1ac;border:1px solid #cab98c;padding:6px 9px;border-radius:999px}
@media(max-width:520px){.hero{align-items:flex-end}.timebox{gap:6px}.calendarline{max-width:210px}}
.familycard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}

.traitrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.trait{font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px;background:#ddcea7;border:1px solid #c5b482;color:#564831}
.npcgoal{font-size:10px;color:#6f6148;margin:3px 0}
.bondrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bond{font-size:9px;padding:3px 6px;border-radius:7px;background:#efe2bf;border:1px solid #d3c294}
.bond.good{background:#dfe8cd;border-color:#bdcda4}.bond.bad{background:#ecd4c7;border-color:#d4a99a}
.memoryline{font-size:9px;color:#7a6d55;margin-top:5px;font-style:italic;line-height:1.35}
.familySummary{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 11px}.familySummary .badge{font-size:10px}
.socialGraph{margin:10px 0 16px;padding:10px;border:1px solid #d4c18f;border-radius:14px;background:#f7edcf88}
.socialGraphTitle{font-size:11px;font-weight:1000;color:#6f5c3d;margin-bottom:8px}
.socialGraphList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.socialEdge{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border:1px solid #d5c49b;border-radius:10px;background:#fff3d5;font-size:10px;color:#554832}
.socialEdge strong{font-size:10px}.socialEdge.good{background:#e8f0d8;border-color:#bfd0a5}.socialEdge.bad{background:#f1ddd2;border-color:#d9b1a2}.socialEdge.kin{background:#efe5c7}

@media(max-width:700px){.socialGraphList{grid-template-columns:1fr}}


.mini{border:1px solid var(--line);background:#eadbb5;color:#3a3122;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:800;cursor:pointer}
.mini:hover{background:#f7e9c4}
.tree{display:grid;gap:0;margin-top:14px;overflow:auto;padding:8px 4px 18px}
.familyTreeHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.familyTreeHeader h3{margin:0;font-size:16px}.familyTreeHeader .note{margin:0}
.generation{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 8px}
.generationLabel{text-align:center;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8a7652;margin-top:2px}
.treeLinkV{width:2px;height:24px;background:linear-gradient(#bca97b,#8e7b53);margin:0 auto;opacity:.72}
.treeLinkV.short{height:14px}
.treeBranchBar{height:2px;background:#a99567;opacity:.65;margin:0 auto;width:min(74%,520px);position:relative}
.treeBranchBar:before,.treeBranchBar:after{content:"";position:absolute;top:0;width:2px;height:12px;background:#a99567}
.treeBranchBar:before{left:0}.treeBranchBar:after{right:0}
.treeNode{position:relative;min-width:122px;max-width:170px;padding:10px 12px;border:1px solid #c9b88d;border-radius:14px;background:linear-gradient(180deg,#fff4d5,#ecddba);box-shadow:0 5px 14px #48361512;text-align:center;color:#30291e}
.treeNode:before{content:"";position:absolute;inset:5px;border:1px solid #fff8e744;border-radius:10px;pointer-events:none}
.treeNode.dead{opacity:.52;filter:grayscale(.55)}
.treeNode.self{background:linear-gradient(145deg,#7de2dc,#39bdb8);border-color:#238f8b;box-shadow:0 0 0 3px #55d6d02b,0 9px 26px #168f8a35;color:#073f3d;transform:translateY(-2px)}
.treeNode.self:after{content:"SEN";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#087b79;color:#fff;border:1px solid #64e4df;border-radius:999px;padding:2px 8px;font-size:8px;font-weight:1000;letter-spacing:.08em}
.treeNode.partner{background:linear-gradient(180deg,#f4e5c3,#e8d2a4)}
.treeNodeName{position:relative;z-index:1;font-size:13px;font-weight:900;line-height:1.15}

function weightedPickEvents(arr){
 const weight=e=>typeof eventEffectiveWeight==="function"?eventEffectiveWeight(e):(e.w||1);
 const total=arr.reduce((a,e)=>a+weight(e),0);
 let roll=Math.random()*total;
 for(const e of arr){roll-=weight(e);if(roll<=0)return e}
 return arr[arr.length-1];
}

}

function setupSwipeCard(){
 const card=$("swipeCard");if(!card)return;
 let startX=0,dx=0,drag=false;
 const overlay=$("decisionOverlay"),left=$("decisionLeft"),right=$("decisionRight"),ls=$("swipeLeftStamp"),rs=$("swipeRightStamp");
 const reset=()=>{
   dx=0;card.style.transform="";card.style.boxShadow="";
   left?.classList.remove("active");right?.classList.remove("active");
   overlay?.classList.remove("lean-left","lean-right");overlay?.style.removeProperty("--swipe-strength");
   if(ls)ls.style.opacity="0";if(rs)rs.style.opacity="0";
 };
 const paint=()=>{
   const rot=dx/24,strength=Math.min(1,Math.abs(dx)/125);
   card.style.transform=`translateX(${dx}px) rotate(${rot}deg)`;
   overlay?.style.setProperty("--swipe-strength",String(Math.max(.18,strength)));
   if(dx<0){
     left?.classList.toggle("active",strength>.08);right?.classList.remove("active");
     overlay?.classList.add("lean-left");overlay?.classList.remove("lean-right");
     card.style.boxShadow=`0 30px 90px #0009,-18px 0 45px rgba(181,70,54,${strength*.3})`;
     if(ls)ls.style.opacity=String(strength);if(rs)rs.style.opacity="0";
   }else if(dx>0){
     right?.classList.toggle("active",strength>.08);left?.classList.remove("active");
     overlay?.classList.add("lean-right");overlay?.classList.remove("lean-left");
     card.style.boxShadow=`0 30px 90px #0009,18px 0 45px rgba(47,132,105,${strength*.32})`;
     if(rs)rs.style.opacity=String(strength);if(ls)ls.style.opacity="0";
   }else reset();
 };
 card.onpointerdown=e=>{if(window._swipeBusy)return;drag=true;startX=e.clientX;dx=0;card.classList.add("dragging");card.setPointerCapture?.(e.pointerId)};
 card.onpointermove=e=>{if(!drag)return;dx=e.clientX-startX;paint()};
 card.onpointerup=e=>{
   if(!drag)return;drag=false;card.classList.remove("dragging");
   if(Math.abs(dx)>=95){const n=dx<0?0:1;if($(n===0?"decisionLeft":"decisionRight")?.disabled){reset();}else animateSwipeOut(n)}
   else reset();
 };
 card.onpointercancel=()=>{drag=false;card.classList.remove("dragging");reset()};
}

  return `<div class="treeNode ${p.alive===false?"dead":""} ${cls}">
   <div class="treeNodeName">${icon(p)} ${safeText(p.name||"Bilinmiyor")}</div>
   <div class="treeNodeMeta">${safeText(label||p.type||"Yakın")} • ${p.age??"?"} yaş</div>
   ${role?`<span class="treeNodeRole">${safeText(role)}</span>`:""}
  </div>`;
 };
 const mini=p=>`<span class="treeMiniNode">${icon(p)} ${safeText(p.name)} • ${safeText(p.type||"Akraba")}${p.age!=null?" • "+p.age:""}</span>`;
 const parentBranch=(p,label)=>{
   const gs=parentGrandparents(p);
   return `<div class="pedigreeParent">
     ${node(p,"",label)}
     <div class="pedigreeGrandparents">
       ${[0,1].map(i=>`<div class="pedigreeGrand">${node(gs[i],"",gs[i]?.type||"Dede / Nine")}</div>`).join("")}
     </div>
   </div>`;
 };
 const children=s.children||[];
 const grandkids=children.flatMap(ch=>(ch.descendants||[]).map(g=>({...g,_parent:ch.name})));

 $("tab-soy").innerHTML=`
 <div class="familyTreeHeader">
  <div><h3>${safeText(s.legacy.familyName)} Soyu</h3><p class="note">${s.legacy.generation}. nesil • ${living} yaşayan yakın • ${past.length} geçmiş yaşam</p></div>
  <div class="treeLegend"><span>Turkuaz = Sen</span><span>† = Ölü</span></div>
 </div>

 <div class="tree">
  <div class="treeSectionTitle">Ata Soyu</div>
  <div class="pedigree">
    <div class="pedigreeSelf">
      ${node({name:s.name,age:s.age,gender:s.gender,alive:s.alive,role:s.role,type:"Sen"},"self","Sen")}
    </div>
    <div class="pedigreeParents">
      ${parentBranch(mother,"Ana")}
      ${parentBranch(father,"Ata")}
    </div>
  </div>

  ${s.siblings.length||sideKin.length?`
   <div class="pedigreeSide">
    <div class="pedigreeSideTitle">Aynı Kuşak ve Yan Kollar</div>
    <div class="pedigreeSideNodes">
      ${s.siblings.map(x=>mini(x)).join("")}
      ${sideKin.map(x=>mini(x)).join("")}
    </div>
   </div>`:""}

  ${children.length?`
   <div class="descTree">
    <div class="treeSectionTitle">Alt Soy</div>
    <div class="descRoot">
      <div class="treeSelfCluster">
        ${node({name:s.name,age:s.age,gender:s.gender,alive:s.alive,role:s.role,type:"Sen"},"self","Sen")}
        ${s.partner?node(s.partner,"partner",s.married?"Eş":"Eş adayı"):""}
      </div>
    </div>
    <div class="descChildren">
      ${children.map(ch=>`<div class="descChild">${node(ch,"","Çocuk")}${(ch.descendants||[]).length?`<div class="descGrandchildren">${(ch.descendants||[]).map(g=>mini({...g,type:"Torun"})).join("")}</div>`:""}</div>`).join("")}
    </div>
   </div>`:""}
 </div>

 <h3>Geçmiş Yaşamlar</h3>
 <div class="grid2">${past.map(x=>`<div class="card"><h3>${safeText(x.name)}</h3><p>${x.age} yaş • ${safeText(x.role||"Görevsiz")} • ün ${x.prestige}</p></div>`).join("")||'<div class="card"><p>Henüz geçmiş yaşam yok.</p></div>'}</div>`;
}
function renderSide(){
 const hp=typeof ensureHealthProfile==="function"?ensureHealthProfile():{scars:[],frailty:0};
 const disp=typeof ensureDisplacement==="function"?ensureDisplacement():null;
 const variety=typeof ensureLifeVariety==="function"?ensureLifeVariety():null;
 const forced=s.captive&&disp?`<br>⛓ ${disp.captivity.months} ay tutsak • hazırlık ${disp.captivity.escapePrep} • erzak ${disp.captivity.rations}`:s.exile&&disp?`<br>↗ ${disp.exile.months} ay sürgün • barınak ${disp.exile.shelter} • erzak ${disp.exile.foodSecurity}`:"";
 const ambition=variety?.ambition?`<br>🎯 ${safeText(variety.ambition.title)} • ${variety.ambition.progress}/${variety.ambition.target}`:"";
 $("sideStatus").innerHTML=`<div class="card"><h3>Durum</h3><p>${s.captive?"⛓ Tutsak":s.exile?"↗ Sürgünde":"✓ Özgür"}${forced}${ambition}<br>${s.military.served?`⚔ ${s.military.campaigns} sefer`:"⚔ Sefer yok"}<br>🩸 ${s.military.wounds} savaş yarası • 🩹 ${hp.scars.length} kalıcı iz<br>🌿 ${s.ailments.length} aktif rahatsızlık • kırılganlık ${hp.frailty}<br>📜 ${(s.eventArchive||[]).length} seçimli olay<br>🧭 ${Object.keys(s.flags||{}).length} yaşam izi</p></div>`;
 const closest=[...s.parents,...s.siblings,...s.children,...s.friends,...(s.partner?[s.partner]:[]),...(s.relatives||[])].filter(x=>x?.alive).sort((a,b)=>(b.rel||0)-(a.rel||0)).slice(0,5);
 $("sideRel").innerHTML=closest.map(r=>`<div class="card relation"><span>${safeText(r.name)}<small style="display:block;color:#7b6d52">${safeText(r.type||"Yakın")}</small></span><span class="badge">${r.rel}</span></div>`).join("");
 let acts="";
 if(s.captive){
   acts+=`<button class="sidebtn" onclick="captivityAction('observe')">👁 Kampı gözle</button><button class="sidebtn" onclick="captivityAction('labor')">🪵 İş gör, erzak kazan</button><button class="sidebtn" onclick="captivityAction('ransom')">📨 Yakınlara haber gönder</button>${s.age>=12?`<button class="sidebtn" onclick="attemptEscape()">↗ Kaçmayı dene</button>`:""}`;
 }else if(s.exile){
   acts+=`<button class="sidebtn" onclick="exileAction('shelter')">⛺ Barınağı güçlendir</button><button class="sidebtn" onclick="exileAction('food')">🧺 Erzak ağı kur</button><button class="sidebtn" onclick="exileAction('return')">📜 Dönüş için arabulucu ara</button>`;
 }
 if(!s.captive&&s.age>=6)acts+=`<button class="sidebtn" onclick="addFriend()">🤝 Dost edin</button>`;
 if(!s.captive&&s.age>=10)acts+=`<button class="sidebtn" onclick="makeRival()">⚔ Rakip edin</button>`;
 if(s.age<6)acts+=`<div class="card"><p class="note">Bu yaşta sosyal çevreni çoğunlukla ailen şekillendiriyor.</p></div>`;
 $("sideActions").innerHTML=acts;
}
function unlock(id){if(!s.achievements.includes(id)){s.achievements.push(id);let a=D.achievements.find(x=>x.id===id);if(a)log(`🏆 Ün kazandın: ${a.name}`,"good")}}
</script>
<script src="systems.js"></script>
</body></html>
