<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAZGI</title><style>

:root{
 --bg:#14160f;--panel:#eee2bd;--panel2:#f8efcf;--ink:#201d15;--muted:#776b52;
 --line:#cbb98a;--green:#5d7652;--red:#a44a3a;--gold:#b58a38;--shadow:0 20px 55px #0006;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:
radial-gradient(circle at 50% 0,#3e3a2a 0,#202217 32%,#11120d 100%);color:#efe6cf}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background:
repeating-linear-gradient(45deg,transparent 0 34px,#fff 35px 36px,transparent 37px 70px)}
button,input,select{font:inherit}
.app{max-width:1280px;margin:auto;padding:16px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:32px;font-weight:900;letter-spacing:.2em}.tag{font-size:12px;opacity:.7}
.top button{background:#ffffff0d;border:1px solid #ffffff2b;color:#f5ecd2;padding:9px 13px;border-radius:11px;cursor:pointer;font-weight:800}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px}
.panel{background:linear-gradient(#f3e8c7,#e7d6ab);color:var(--ink);border:1px solid #fff5;border-radius:18px;box-shadow:var(--shadow)}
.profile,.side{padding:15px;height:max-content;position:sticky;top:16px}
.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:42px;background:radial-gradient(circle,#dac28a,#a88145);border:5px solid #f8edd0}
.name{text-align:center;font-size:22px;font-weight:900;margin-top:8px}.meta{text-align:center;color:var(--muted);font-size:12px;line-height:1.45}
.wealth{text-align:center;font-size:19px;font-weight:900;color:#6d4b1f;margin:10px 0}
.stats{display:grid;gap:8px}.stat{display:grid;grid-template-columns:76px 1fr 29px;gap:6px;align-items:center;font-size:11px}
.bar{height:7px;background:#d3c6a5;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.qbtn,.sidebtn{border:1px solid var(--line);background:#f9efd0;border-radius:10px;padding:9px 7px;cursor:pointer;font-weight:800;color:#282319;font-size:11px}
.qbtn:hover,.sidebtn:hover{background:#fff5db}
.main{display:flex;flex-direction:column;gap:12px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
.age{font-size:36px;font-weight:900;line-height:1}.age small{font-size:13px;color:var(--muted)}
.agebtn{border:0;border-radius:12px;padding:13px 22px;background:var(--green);color:white;font-weight:900;cursor:pointer}
.tabs{display:flex;gap:5px;flex-wrap:wrap;padding:9px}.tab{border:0;background:transparent;color:#6e624c;padding:9px 11px;border-radius:9px;cursor:pointer;font-weight:900;font-size:12px}
.tab.active{background:#d8c79d;color:#2e281c}.content{padding:12px}
.timeline{display:flex;flex-direction:column;gap:8px;max-height:610px;overflow:auto;padding-right:4px}
.log{background:#faf0d3;border-left:3px solid #a59060;border-radius:0 12px 12px 0;padding:10px 11px;font-size:13px;line-height:1.45}
.log.good{border-color:#66865c}.log.bad{border-color:#a54b3c}.log.major{border-color:#b78a38;background:#fff3c9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);background:#f9efd0;border-radius:12px;padding:11px;text-align:left;color:#282319}
button.card{cursor:pointer}.card:hover{background:#fff5dc}.card h3{margin:0 0 4px;font-size:14px}.card p{margin:0;color:#74684f;font-size:11px;line-height:1.4}
.side h3{font-size:13px;margin:3px 0 8px}.sidegroup{display:grid;gap:6px;margin-bottom:12px}.sidebtn{text-align:left}
.badge{display:inline-block;padding:3px 6px;border-radius:999px;background:#ded0aa;font-size:10px;color:#5a503d}
.hidden{display:none!important}.dead{filter:grayscale(.75)}
.modalwrap{position:fixed;inset:0;background:#0c0e0adf;display:none;place-items:center;padding:14px;z-index:30}.modalwrap.show{display:grid}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#efe2bd;color:#201c13;border-radius:18px;padding:20px;box-shadow:0 30px 90px #000b}
.modal h2{margin-top:0}.row{display:grid;gap:5px;margin:10px 0}label{font-size:11px;color:#6f634c;font-weight:800}
select,input{padding:10px;border:1px solid #c8b68a;border-radius:9px;background:#fff7df;color:#251f16}
.mbuttons{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.mbtn{border:0;padding:10px 13px;border-radius:9px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:white}.ghost{background:#d9c79d}
.note{color:#756a52;font-size:11px;line-height:1.45}.relation{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rbar{height:5px;width:70px;background:#d5c8a8;border-radius:99px;overflow:hidden}.rbar i{display:block;height:100%;background:#66865c}
@media(max-width:980px){.layout{grid-template-columns:240px 1fr}.side{position:static;grid-column:1/-1}.side .sidegroup{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.profile{position:static}.grid2{grid-template-columns:1fr}.side .sidegroup{grid-template-columns:1fr 1fr}}

.calendarline{margin-top:7px;font-size:13px;color:#6e5126;font-weight:800}
.timebox{display:flex;align-items:flex-end;gap:10px;flex-direction:column}
.monthrights{font-size:12px;font-weight:900;color:#6a604c;background:#dfd1ac;border:1px solid #cab98c;padding:6px 9px;border-radius:999px}
@media(max-width:520px){.hero{align-items:flex-end}.timebox{gap:6px}.calendarline{max-width:210px}}
.familycard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.familycard .actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#eadbb5;color:#3a3122;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:800;cursor:pointer}
.mini:hover{background:#f7e9c4}
.tree{display:grid;gap:10px}
.treeRow{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start}
.treeLabel{font-size:11px;font-weight:900;color:#77684e;padding-top:8px}
.treePeople{display:flex;gap:7px;flex-wrap:wrap}
.personChip{background:#f9efd0;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:11px}
.personChip.dead{opacity:.55;text-decoration:line-through}

</style>
</head>

    <button class="qbtn" onclick="activity('av')">🦌 Avlan</button><button class="qbtn" onclick="activity('toy')">🔥 Toya Katıl</button>
   </div>

  <main class="main">

 </div>

 </div>
</section>
   <section class="panel">
    <div class="tabs">
     <button class="tab active" onclick="showTab('hayat',this)">Hayat</button>
     <button class="tab" onclick="showTab('yetisme',this)">Yetişme</button>
     <button class="tab" onclick="showTab('gorev',this)">Görev</button>
     <button class="tab" onclick="showTab('aile',this)">Aile</button>
     <button class="tab" onclick="showTab('varlik',this)">Varlıklar</button>
     <button class="tab" onclick="showTab('tore',this)">Töre</button>
     <button class="tab" onclick="showTab('soy',this)">Soy</button>
    </div>
    <div class="content">
     <div id="tab-hayat"><div class="timeline" id="timeline"></div></div>
     <div id="tab-yetisme" class="hidden"></div><div id="tab-gorev" class="hidden"></div><div id="tab-aile" class="hidden"></div>
     <div id="tab-varlik" class="hidden"></div><div id="tab-tore" class="hidden"></div><div id="tab-soy" class="hidden"></div>
    </div>
   </section>
  </main>

  <aside class="panel side">
   <h3>Yaşam Durumu</h3><div id="sideStatus" class="sidegroup"></div>
   <h3>Yakınların</h3><div id="sideRel" class="sidegroup"></div>
   <h3>Hızlı Eylemler</h3><div id="sideActions" class="sidegroup"></div>
  </aside>
 </div>
</div>

const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

const npcRole=age=>{
 if(age<8)return "Çocuk";

 if(age<16)return pick(["At binmeyi öğreniyor","Okçuluk öğreniyor","Usta yanında yetişiyor"]);

};
function npcDeathRisk(n){
 const a=n.age??20; let r=0;
 if(a>45)r+=(a-45)*.0025;
 if(a>65)r+=(a-65)*.009;
 if((n.health??80)<30)r+=.04;
 return Math.min(.35,r);
}
function normalizeNPC(n,type="Yakın"){

  if(r.startsWith("flag:"))return !!(s.flags||{})[r.slice(5)];
  if(r.startsWith("notflag:"))return !(s.flags||{})[r.slice(8)];
  if(r==="single")return !s.partner&&!s.married;
  if(r==="married")return !!s.married;
  if(r==="hasChild")return (s.children||[]).some(x=>x.alive!==false);
  if(r==="hasAdultChild")return (s.children||[]).some(x=>x.alive!==false&&(x.age||0)>=16);
  if(r==="prestige15")return s.prestige>=15;
  if(r==="prestige20")return s.prestige>=20;
  if(r==="prestige30")return s.prestige>=30;
  if(r==="prestige35")return s.prestige>=35;
  if(r==="wealth20")return s.wealth>=20;
  if(r==="wealth30")return s.wealth>=30;
  if(r==="wealth40")return s.wealth>=40;
  if(r==="skill40")return s.skill>=40;
  if(r==="skill45")return s.skill>=45;
  if(r==="skill65")return s.skill>=65;
  if(r==="military")return s.military?.served||s.path==="military"||["Alp","Akıncı","Tarkan"].includes(s.role);
  if(r==="captive")return !!s.captive;
  if(r==="exile")return !!s.exile;
  return true;
 };
 return check(ev.req);
}
function eligibleContextEvents(){
 const hist=s.eventHistory||[], cd=s.eventCooldowns||{};
 return EVENT_DECK.filter(ev=>{
   if(s.age<ev.min||s.age>ev.max)return false;
   if(ev.once&&hist.includes(ev.id))return false;
   if((cd[ev.id]||0)>0)return false;
   return eventRequirementOK(ev);
 });
}
function weightedPickEvents(arr){
 const total=arr.reduce((a,e)=>a+(e.w||1),0);
 let roll=Math.random()*total;
 for(const e of arr){roll-=e.w||1;if(roll<=0)return e}
 return arr[arr.length-1];
}
function tickEventCooldowns(){
 s.eventCooldowns=s.eventCooldowns||{};
 for(const k of Object.keys(s.eventCooldowns))s.eventCooldowns[k]=Math.max(0,s.eventCooldowns[k]-1);
}
function applyEventChoice(extra={}){
 const effects={};
 for(const k of ["health","happiness","skill","prestige","wealth"])if(extra[k]!=null)effects[k]=extra[k];
 apply(effects);
 s.flags=s.flags||{};
 const setOne=k=>{if(k)s.flags[k]=true};
 const clearOne=k=>{if(k)delete s.flags[k]};
 if(Array.isArray(extra.setFlag))extra.setFlag.forEach(setOne);else setOne(extra.setFlag);
 clearOne(extra.clearFlag);clearOne(extra.clearFlag2);
 if(extra.path)s.path=extra.path;
 if(extra.setRole)s.role=extra.setRole;
 if(extra.wound){s.military=s.military||{called:false,served:false,campaigns:0,wounds:0};s.military.wounds=(s.military.wounds||0)+extra.wound}
 if(extra.clearExile)s.exile=false;
}
function triggerContextEvent(force=false){
 if(!s||!s.alive)return false;
 if(!force&&Math.random()>.34)return false;
 const arr=eligibleContextEvents();if(!arr.length)return false;
 const ev=weightedPickEvents(arr);
 s.eventHistory=s.eventHistory||[];s.eventCooldowns=s.eventCooldowns||{};s.eventArchive=s.eventArchive||[];s.flags=s.flags||{};
 if(ev.once&&!s.eventHistory.includes(ev.id))s.eventHistory.push(ev.id);
 s.eventCooldowns[ev.id]=ev.cool||12;
 window._contextEvent=ev;
 $("eventText").innerHTML=`<span class="badge">${ev.cat}</span><br><br>${ev.text}`;
 $("eventChoices").innerHTML=ev.choices.map((ch,i)=>`<button class="card" onclick="chooseContextEvent(${i})"><h3>${ch[0]}</h3></button>`).join("");
 $("eventModal").classList.add("show");
 return true;
}
function chooseContextEvent(i){
 const ev=window._contextEvent;if(!ev)return;
 const ch=ev.choices[i];applyEventChoice(ch[1]||{});
 s.eventArchive=s.eventArchive||[];
 s.eventArchive.push({id:ev.id,cat:ev.cat,age:s.age,year:s.year+s.age,month:currentMonth(),choice:ch[0]});
 if(s.eventArchive.length>300)s.eventArchive=s.eventArchive.slice(-300);
 log(`<b>${ev.cat}:</b> ${ev.text} <i>${ch[0]}</i>`,((ch[1]?.health||0)<0||(ch[1]?.happiness||0)<0)?"bad":"");
 $("eventModal").classList.remove("show");window._contextEvent=null;render();save();
}

function mod(n,m){return ((n%m)+m)%m}

// Bu tarih oyun içindeki hayvan-yılı döngüsüne tarihsel çapa olarak kullanılır.
function animalYearIndex(ceYear){return mod((ceYear-731)+7,12)}
function animalYearName(ceYear){return TURK_YEAR_ANIMALS[animalYearIndex(ceYear)]}
function seasonForMonth(m){

 if(m<=6)return "Yaz";
 if(m<=9)return "Sonbahar";
 return "Kış";
}
function currentMonth(){
 if(!s)return 1;
 return Math.min(12,Math.max(1,13-(s.monthsRemaining??12)));
}
function canSpendMonth(){

 if((s.monthsRemaining??12)<=0){
   alert("Bu yılın 12 ayını kullandın. Şimdi yaş atlaman gerekiyor.");

 }

}

   log(`Yılın 12 ayını tamamladın. Artık <b>yaş atlayabilirsin</b>.`,"major");

}

 if(s.role){

   apply({health:-rng(1,3)});
   log("Kış aylarının sertliği sağlığını biraz zorladı.","bad");
 }
 [...s.parents,...s.siblings,...s.friends,...s.rivals].forEach(r=>{
   if(r.alive && Math.random()<.35) r.rel=clamp(r.rel+rng(-1,1));
 });
 setTimeout(()=>triggerContextEvent(false),0);
}
function passOneMonth(){

 if((s.monthsRemaining??12)<=0){ ageUp(); return; }
 if(s.captive){ captivityMonth(); return; }
 spendMonth("Bu ayı belirgin bir işe girişmeden geçirdin.");
}

function ageUp(){

   alert(`Önce bu yılın kalan ${s.monthsRemaining} ayını geçir.`);
   return;
 }
 // 12 ay tamamlandı: yeni yaş/yıl başlar ve 12 aylık yeni hak açılır.

 if(s.age>40)s.health=clamp(s.health-rng(0,2));
 if(s.age===7)log("Oba işlerinde daha fazla sorumluluk almaya başladın.");

function takeRole(id){
 const r=D.careers.find(x=>x.id===id);if(!r||s.captive)return;
 if(!canSpendMonth())return;
 let chance=.42+(s.skill-r.skill)/100+s.prestige/250;if(s.path===r.path)chance+=.12;
 if(Math.random()<chance){s.role=r.name;s.path=r.path;apply({prestige:r.prestige,wealth:rng(r.wealth[0],r.wealth[1])});log(`${r.name} görevini üstlendin.`,"good");if(r.id==="bey")unlock("bey")}
 else log(`${r.name} olmak için girişimin kabul görmedi.`,"bad");
 spendMonth("Görev için bir ay uğraştın.");
}
function getFamilyGroup(group){
 if(group==="parents")return s.parents;
 if(group==="siblings")return s.siblings;
 if(group==="friends")return s.friends;
 if(group==="rivals")return s.rivals;
 if(group==="children")return s.children;
 return [];
}
function interactNPC(group,index,action){
 if(!canSpendMonth())return;
 const arr=getFamilyGroup(group),n=arr[index];if(!n||!n.alive)return;
 normalizeNPC(n,n.type);
 if(action==="spend"){n.rel=clamp(n.rel+rng(5,11));apply({happiness:2});log(`${n.name} ile birlikte vakit geçirdin.`,"good")}
 if(action==="gift"){
   const cost=3;if(s.wealth<cost)return alert("Hediye için 3 servet gerekiyor.");
   s.wealth-=cost;n.rel=clamp(n.rel+rng(8,15));log(`${n.name}'e küçük bir armağan verdin.`,"good")
 }
 if(action==="advice"){
   n.rel=clamp(n.rel+rng(2,6));apply({skill:rng(1,3)});log(`${n.name}'den öğüt aldın.`)
 }
 spendMonth(`${n.name} ile ilgilenerek bir ay geçirdin.`);
}
function familyCard(n,group,index){
 normalizeNPC(n,n.type);
 return `<div class="card familycard"><div><h3>${n.alive?"":"† "}${n.name}</h3><p>${n.type||"Yakın"} • ${n.age??"?"} yaş • ${n.role||""}<br>İlişki ${n.rel??0}${n.partner?` • Eş: ${n.partner.name}`:""}${n.children?` • Çocuk: ${n.children}`:""}</p><div class="rbar"><i style="width:${n.rel??0}%"></i></div></div>${n.alive?`<div class="actions"><button class="mini" onclick="interactNPC('${group}',${index},'spend')">Vakit geçir</button><button class="mini" onclick="interactNPC('${group}',${index},'advice')">Öğüt al</button><button class="mini" onclick="interactNPC('${group}',${index},'gift')">Armağan</button></div>`:""}</div>`;
}
function renderFamily(){
 s.parents.forEach(x=>normalizeNPC(x,x.type));s.siblings.forEach(x=>normalizeNPC(x,x.type));s.children.forEach(x=>normalizeNPC(x,"Çocuk"));
 let html=`<h3>Aile</h3><div class="grid2">${s.parents.map((r,i)=>familyCard(r,"parents",i)).join("")}${s.siblings.map((r,i)=>familyCard(r,"siblings",i)).join("")}</div>`;
 html+=`<h3>Ocak</h3><div class="grid2">`;
 if(!s.partner&&s.age>=15)html+=`<button class="card" onclick="meetPartner()"><h3>❤️ Eş Adayı Bul</h3><p>Başka bir aileyle bağ kur.</p></button>`;
 if(s.partner)html+=`<div class="card"><h3>❤️ ${s.partner.name}</h3><p>${s.married?"Eşin":"Eş adayın"} • ilişki ${s.partner.rel}</p></div>`;
 if(s.partner&&!s.married)html+=`<button class="card" onclick="marry()"><h3>🔥 Ocak Kur</h3><p>Ailelerin onayını iste.</p></button>`;
 html+=`</div>`;
 if(s.children.length)html+=`<h3>Çocuklar</h3><div class="grid2">${s.children.map((r,i)=>familyCard(r,"children",i)).join("")}</div>`;
 if(s.friends.length)html+=`<h3>Dostlar</h3><div class="grid2">${s.friends.map((r,i)=>familyCard(r,"friends",i)).join("")}</div>`;
 if(s.rivals.length)html+=`<h3>Rakipler</h3><div class="grid2">${s.rivals.map((r,i)=>familyCard(r,"rivals",i)).join("")}</div>`;
 $("tab-aile").innerHTML=html;
}
function meetPartner(){if(!canSpendMonth())return;let cfg=D.realms[s.realm],g=s.gender==="male"?"female":"male";s.partner={name:pick(cfg[g]),rel:rng(55,85),alive:true};apply({happiness:5});log(`${s.partner.name} ile ailelerin aracılığıyla tanıştın.`,"good");spendMonth("Aileler arası görüşmelerle bir ay geçti.")}
function marry(){if(!canSpendMonth())return;if(Math.random()<.78){s.married=true;unlock("family");apply({prestige:3});log(`${s.partner.name} ile ocak kurdun.`,"good")}else log("Aileler bu evliliği uygun görmedi.","bad");spendMonth("Evlilik görüşmeleri bir ay sürdü.")}
function renderAssets(){
 $("tab-varlik").innerHTML=`<div class="grid2">${D.assets.map(a=>`<button class="card" onclick="buyAsset('${a.id}')"><h3>${a.icon} ${a.name}</h3><p>${a.cost} servet</p></button>`).join("")}</div>${s.assets.length?`<h3>Sahip Oldukların</h3><div class="grid2">${s.assets.map(id=>{let a=D.assets.find(x=>x.id===id);return `<div class="card"><h3>${a.icon} ${a.name}</h3></div>`}).join("")}</div>`:""}`
}
function buyAsset(id){if(!canSpendMonth())return;let a=D.assets.find(x=>x.id===id);if(!a||s.assets.includes(id))return;if(s.wealth<a.cost)return alert("Yeterli servetin yok.");s.wealth-=a.cost;s.assets.push(id);apply({happiness:3});log(`${a.name} edindin.`,"good");spendMonth("Alım, hazırlık ve takas işleriyle bir ay geçti.")}
function renderTore(){
 $("tab-tore").innerHTML=`<div class="grid2">${D.crimes.map(c=>`<button class="card" onclick="commitCrime('${c.id}')"><h3>${c.name}</h3><p>Yakalanma riski ${(c.risk*100)|0}%</p></button>`).join("")}</div>
 <p class="note">Yakalanırsan tazminat, itibar kaybı, sürgün veya tutsaklık gibi sonuçlar doğabilir.</p>
 ${s.crimeRecord.length?`<h3>Kayıt</h3><div class="grid2">${s.crimeRecord.map(x=>`<div class="card"><h3>${x.name}</h3><p>${x.result}</p></div>`).join("")}</div>`:""}`
}
function commitCrime(id){
 let c=D.crimes.find(x=>x.id===id);if(!c||s.captive)return;
 if(!canSpendMonth())return;
 if(Math.random()<c.risk){
  let roll=Math.random(),result="";
  apply({prestige:c.prestige});
  if(roll<.35){let fine=rng(4,12);s.wealth=Math.max(0,s.wealth-fine);result=`Yakalandın; ${fine} servet tazminat ödedin.`}
  else if(roll<.68){s.exile=true;result="Yakalandın ve obadan sürgün edildin.";s.place=pick(D.realms[s.realm].places)}
  else {s.captive=true;result="Yakalandın ve gözetim altında tutsak edildin.";unlock("captive")}
  s.crimeRecord.push({name:c.name,result});log(result,"bad")
 } else {
  let gain=rng(c.gain[0],c.gain[1]);s.wealth+=gain;s.crimeRecord.push({name:c.name,result:`Yakalanmadın; ${gain} servet kazandın.`});log(`${c.name}: yakalanmadın ve ${gain} servet kazandın.`,"good")
 }
 spendMonth("Töre dışı girişimin sonuçlarıyla bir ay geçti.");
}
function renderLegacy(){
 const chips=a=>a.map(x=>`<span class="personChip ${x.alive===false?"dead":""}">${x.alive===false?"† ":""}${x.name}${x.age!=null?` • ${x.age}`:""}</span>`).join("");
 $("tab-soy").innerHTML=`<div class="card"><h3>${s.legacy.familyName} Soyu</h3><p>${s.legacy.generation}. nesil • geçmiş yaşam sayısı ${s.legacy.past.length}</p></div>
 <div class="tree">
  <div class="treeRow"><div class="treeLabel">Ana / Ata</div><div class="treePeople">${chips(s.parents)}</div></div>
  <div class="treeRow"><div class="treeLabel">Kardeşler</div><div class="treePeople">${chips(s.siblings)}</div></div>
  <div class="treeRow"><div class="treeLabel">Sen</div><div class="treePeople"><span class="personChip"><b>${s.name}</b> • ${s.age}</span>${s.partner?`<span class="personChip">❤️ ${s.partner.name}</span>`:""}</div></div>
  <div class="treeRow"><div class="treeLabel">Çocuklar</div><div class="treePeople">${chips(s.children)}</div></div>
 </div>
 <h3>Geçmiş Yaşamlar</h3><div class="grid2">${s.legacy.past.map(x=>`<div class="card"><h3>${x.name}</h3><p>${x.age} yaş • ${x.role||"Görevsiz"} • ün ${x.prestige}</p></div>`).join("")}</div>`
}
function renderSide(){
 $("sideStatus").innerHTML=`<div class="card"><h3>Durum</h3><p>${s.captive?"⛓ Tutsak":s.exile?"↗ Sürgünde":"✓ Özgür"}<br>${s.military.served?`⚔ ${s.military.campaigns} sefer`:"⚔ Sefer yok"}<br>🩸 ${s.military.wounds} yara<br>📜 ${(s.eventArchive||[]).length} seçimli olay<br>🧭 ${Object.keys(s.flags||{}).length} yaşam izi</p></div>`;
 $("sideRel").innerHTML=[...s.parents,...s.siblings].slice(0,5).map(r=>`<div class="card relation"><span>${r.name}</span><span class="badge">${r.rel}</span></div>`).join("");
 $("sideActions").innerHTML=`${s.captive?`<button class="sidebtn" onclick="captivityMonth()">⛓ Tutsaklıkta 1 Ay Geçir</button><button class="sidebtn" onclick="attemptEscape()">↗ Kaçmayı dene</button>`:""}<button class="sidebtn" onclick="addFriend()">🤝 Dost edin</button><button class="sidebtn" onclick="makeRival()">⚔ Rakip edin</button>`;
}
function attemptEscape(){if(!s.captive)return;if(!canSpendMonth())return;if(Math.random()<.18+s.skill/350){s.captive=false;unlock("free");log("Tutsaklıktan kaçmayı başardın!","major")}else{apply({health:-5,happiness:-4});log("Kaçış girişimin başarısız oldu.","bad")}
spendMonth("Kaçış planıyla bir ay geçti.")}
function addFriend(){if(!canSpendMonth())return;let cfg=D.realms[s.realm],g=Math.random()<.5?"male":"female";s.friends.push(normalizeNPC({name:pick(cfg[g]),rel:rng(50,80),type:"Dost",alive:true,gender:g,age:Math.max(8,s.age+rng(-4,4))},"Dost"));log("Yeni bir dost edindin.");spendMonth("Yeni dostluk kurmakla bir ay geçti.")}
function makeRival(){if(!canSpendMonth())return;let cfg=D.realms[s.realm],g=Math.random()<.5?"male":"female";s.rivals.push(normalizeNPC({name:pick(cfg[g]),rel:rng(10,35),type:"Rakip",alive:true,gender:g,age:Math.max(8,s.age+rng(-4,4))},"Rakip"));log("Aranda husumet bulunan yeni bir rakibin oldu.","bad");spendMonth("Bu çekişmeyle bir ay geçti.")}
function unlock(id){if(!s.achievements.includes(id)){s.achievements.push(id);let a=D.achievements.find(x=>x.id===id);if(a)log(`🏆 Ün kazandın: ${a.name}`,"good")}}
function openDecision(text,choices,consumeMonth=false){$("eventText").textContent=text;window._choices=choices;window._decisionConsumesMonth=consumeMonth;$("eventChoices").innerHTML=choices.map((x,i)=>`<button class="card" onclick="chooseDecision(${i})"><h3>${x[0]}</h3></button>`).join("");$("eventModal").classList.add("show")}
function chooseDecision(i){
 if(window._decisionConsumesMonth&&!canSpendMonth()){$("eventModal").classList.remove("show");return}
 let ch=window._choices[i];if(typeof ch[1]==="function")ch[1]();
 $("eventModal").classList.remove("show");
 if(window._decisionConsumesMonth)spendMonth("Verdiğin kararın sonuçlarıyla bir ay geçti.");
 else{render();save()}
 window._decisionConsumesMonth=false;
}
function save(){if(s)localStorage.setItem("yazgi_full_v1",JSON.stringify(s))}
function load(){try{let x=JSON.parse(localStorage.getItem("yazgi_full_v1"));if(x){
 s=x;
 s.parents=(s.parents||[]).map(n=>normalizeNPC(n,n.type));
 s.siblings=(s.siblings||[]).map(n=>normalizeNPC(n,n.type));
 s.friends=(s.friends||[]).map(n=>normalizeNPC(n,"Dost"));
 s.rivals=(s.rivals||[]).map(n=>normalizeNPC(n,"Rakip"));
 s.children=(s.children||[]).map(n=>normalizeNPC(n,"Çocuk"));
 s.eventHistory=s.eventHistory||[];s.eventCooldowns=s.eventCooldowns||{};
 $("newModal").classList.remove("show");render()
}}catch(e){console.error(e)}}
init();

</script>
</body></html>
